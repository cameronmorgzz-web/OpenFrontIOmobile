; Beer Launcher firmware. Shared logic lives in ../common (PlatformIO library).
;   pio run -e esp32c3            build for the ESP32-C3 SuperMini
;   pio run -e esp32c3 -t upload  flash (USB CDC)
;   pio test -e native            host unit tests (Unity)

[platformio]
default_envs = esp32c3

[env]
lib_deps = symlink://../common

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17
